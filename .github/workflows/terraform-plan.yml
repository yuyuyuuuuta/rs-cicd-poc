name: Terraform plan PR (automatic)
run-name: "Terraform plan PR #${{ github.event.pull_request.number }}"

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_PAGER: ""
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_branch: ${{ steps.pr.outputs.pr_branch }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      targets: ${{ steps.pr.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Inspect PR and mark its exact head pending
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/terraform_apply.py prepare-plan

  static-checks:
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.head_sha }}
          path: candidate
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Check PR Terraform without AWS credentials
        env:
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
          TARGET_ROOTS: ${{ needs.inspect.outputs.targets }}
        run: python3 .github/scripts/terraform_apply.py validate

  aws-plan:
    needs: [inspect, static-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      planned_head: ${{ steps.plan.outputs.planned_head }}
      planned_base: ${{ steps.plan.outputs.planned_base }}
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_GITHUB_PLAN_ROLE_ARN: ${{ secrets.AWS_GITHUB_PLAN_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_TEST_BUCKET: ${{ secrets.TF_TEST_BUCKET }}
      TF_PLAN_ARTIFACT_BUCKET: ${{ secrets.TF_PLAN_ARTIFACT_BUCKET }}
      TF_PIPELINE_NAMES: ${{ secrets.TF_PIPELINE_NAMES }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validate private plan configuration
        run: python3 .github/scripts/terraform_apply.py check-plan-config
      - name: Diagnose OIDC subject (no token output)
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            core.setSecret(token);
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(JSON.stringify({sub: claims.sub, aud: claims.aud}));
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_PLAN_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: gha-terraform-plan
          role-duration-seconds: 3600
      - name: Verify AWS account
        shell: bash
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          [[ "$account" == "$AWS_ACCOUNT_ID" ]]
      - name: Run plan for exact PR head
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.inspect.outputs.pr_number }}
          PR_BRANCH: ${{ needs.inspect.outputs.pr_branch }}
          EXPECTED_HEAD_SHA: ${{ needs.inspect.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.inspect.outputs.base_sha }}
          TARGET_ROOTS: ${{ needs.inspect.outputs.targets }}
        run: python3 .github/scripts/terraform_apply.py plan

  publish-plan-status:
    if: always()
    needs: [inspect, static-checks, aws-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Publish the final plan status for the exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_HEAD_SHA: ${{ needs.inspect.outputs.head_sha }}
          PLAN_BASE_SHA: ${{ needs.inspect.outputs.base_sha }}
          PREFLIGHT_RESULT: ${{ needs.inspect.result }}
          STATIC_CHECK_RESULT: ${{ needs.static-checks.result }}
          PLAN_RESULT: ${{ needs.aws-plan.result }}
          PLAN_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/terraform_apply.py finalize-plan-status